name: Daily GitHub Trending Email

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  github-trending-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch GitHub Trending
        run: |
          echo "Fetching GitHub Trending..."
          curl -s https://github.com/trending > trending.html
          echo "Page fetched successfully!"

      - name: Show page info
        run: |
          echo "Page size: $(ls -lh trending.html)"
          echo "First 500 characters:"
          head -c 500 trending.html