name: Daily GitHub Trending Email

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get GitHub Trending
        uses: talljack/github-trending-email@main
        id: trending
        with:
          languages: '[""]'
          enableHuggingFace: 'false'
          enableHackerNews: 'false'
          enableProductHunt: 'false'
          enableAIPapers: 'false'
          enableIndieHackers: 'false'
          itemLimit: '20'

      - name: Send Email
        run: python send_email.py "${{ steps.trending.outputs.trendingData }}"