name: Daily GitHub Trending Email

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Get GitHub Trending
        uses: talljack/github-trending-email@main
        id: trending
        with:
          languages: '["", "python", "javascript", "go", "rust"]'
          enableHuggingFace: 'false'
          enableHackerNews: 'false'
          enableDevTo: 'false'
          enableAIPapers: 'false'
          enableIndieRevenue: 'false'
          itemLimit: '10'

      - name: Send Email with Archive
        run: python send_email_with_archive.py "${{ steps.trending.outputs.trendingData }}"
